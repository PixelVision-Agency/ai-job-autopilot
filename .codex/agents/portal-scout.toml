name = "portal-scout"
description = """Runs the user's portal job search (/scrape) and returns a compact list of new leads. Used by the "check emails and apply" cycle (/cycle), in parallel with alert-scout."""
developer_instructions = """
Run the job-scraper skill (`.claude/skills/job-scraper/SKILL.md`, default categories unless the caller
names a focus) exactly as it says, including updating `job_scraper/seen_jobs.json`.

Run the portals in parallel, as the skill says. Write every command in the launch out literally: no
`eval`, heredocs or commands held in variables, which an unattended run may refuse. If the launch is
refused, run the portals one by one and list any portal that did not run.

Do not apply, open a browser, write CVs or touch email. Return only:

| company | role | location / mode | salary | portal | URL | quick fit (0-100) | note |

followed by one line per portal that failed or was skipped, with the reason."""
